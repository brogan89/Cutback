name: Release

# Releases are manual: run this workflow from the Actions tab with a version and tick "publish"
# to create the tag and GitHub Release. Every merge to main runs the same pipeline as a dry run
# (archives uploaded as workflow artifacts, nothing published) so packaging breakage shows up
# before the next release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without a leading v (e.g. 0.2.0 or 0.2.0-beta.1)
        required: true
      publish:
        description: Create the tag and GitHub Release. Leave unticked for a dry run.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            publish="$INPUT_PUBLISH"
          else
            version="0.0.0-ci.$GITHUB_RUN_NUMBER"
            publish=false
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$version' is not X.Y.Z or X.Y.Z-prerelease"
            exit 1
          fi
          if [[ "$publish" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases are published from main only (ran on $GITHUB_REF)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building Cutback $version (publish: $publish)"

  build:
    name: ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # VideoLAN.LibVLC.Windows is only referenced when the build host is Windows,
          # so win-x64 must be published on a Windows runner.
          - os: windows-latest
            rid: win-x64
            natives: true
          - os: ubuntu-latest
            rid: linux-x64
            natives: true
          # Inside an .app bundle loose dylibs are what codesign expects, so do not self-extract.
          - os: macos-latest
            rid: osx-arm64
            natives: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Cutback.App -c Release -r "$RID" --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=${{ matrix.natives }} \
            -p:PublishTrimmed=false \
            -p:PublishReadyToRun=false \
            -p:DebugType=embedded \
            -p:PublishDocumentationFiles=false \
            -p:PublishDocumentationFile=false \
            -p:Version="$VERSION" \
            -p:ContinuousIntegrationBuild=true \
            -o "artifacts/publish/$RID"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="Cutback-$VERSION-$RID"
          mkdir -p "artifacts/stage/$name" artifacts/dist
          cp -R "artifacts/publish/$RID"/. "artifacts/stage/$name/"
          cp LICENSE THIRD-PARTY-NOTICES.md "artifacts/stage/$name/"
          (cd artifacts/stage && 7z a -tzip "../dist/$name.zip" "$name")

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="Cutback-$VERSION-$RID"
          mkdir -p "artifacts/stage/$name" artifacts/dist
          cp -R "artifacts/publish/$RID"/. "artifacts/stage/$name/"
          cp LICENSE THIRD-PARTY-NOTICES.md "artifacts/stage/$name/"
          chmod +x "artifacts/stage/$name/Cutback"
          tar -czf "artifacts/dist/$name.tar.gz" -C artifacts/stage "$name"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts/dist
          scripts/package-macos.sh "artifacts/publish/$RID" "$VERSION" artifacts/dist

      - uses: actions/upload-artifact@v7
        with:
          name: Cutback-${{ env.VERSION }}-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to overwrite an existing release or tag
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Pick a new version."
            exit 1
          fi
          existing=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag already exists at $existing, not at $GITHUB_SHA."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create tag and GitHub Release
        run: |
          args=(--target "$GITHUB_SHA" --generate-notes --title "Cutback $VERSION")
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "v$VERSION" "${args[@]}" dist/*
