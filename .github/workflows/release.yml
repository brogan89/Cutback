name: Release

# Every merge to main publishes a GitHub Release for all three platforms. The version is the last
# stable v<X.Y.Z> tag with the patch bumped, or <Version> from Directory.Build.props when that is
# ahead of the tags (bump it in a PR to start a new minor or major) or when no tag exists yet.
# Pull requests run the same pipeline as a dry run (archives uploaded as workflow artifacts,
# nothing published) so packaging breakage blocks the PR rather than the release. The per-RID
# build jobs are required status checks on main.
#
# workflow_dispatch remains for prereleases (0.2.0-beta.1) and explicit versions: enter the version
# and tick "publish" on main. Prerelease tags are ignored when computing the next automatic version.
#
# Runs on main are serialised by the concurrency group, so each merge sees the previous merge's
# tag. GitHub keeps at most one pending run per group, so if three merges land within one build
# the middle one is skipped; its changes ship in the next merge's release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without a leading v (e.g. 0.2.0 or 0.2.0-beta.1)
        required: true
      publish:
        description: Create the tag and GitHub Release. Leave unticked for a dry run.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer push to a PR supersedes its dry run; a real release must never be cancelled mid-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      # Tags are needed to compute the next automatic version.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            publish="$INPUT_PUBLISH"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            props=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props)
            props=${props%%-*}
            # Stable tags only; a prerelease tag from a manual run must not feed the next version.
            latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [[ -z "$latest" ]]; then
              version="$props"
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              version="$major.$minor.$((patch + 1))"
              # A <Version> bump in Directory.Build.props that is ahead of the tags wins.
              if [[ "$props" != "$version" && "$(printf '%s\n%s\n' "$version" "$props" | sort -V | tail -1)" == "$props" ]]; then
                version="$props"
              fi
            fi
            echo "Last stable tag: ${latest:-none}; Directory.Build.props: $props"
            publish=true
          else
            version="0.0.0-ci.$GITHUB_RUN_NUMBER"
            publish=false
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$version' is not X.Y.Z or X.Y.Z-prerelease"
            exit 1
          fi
          if [[ "$publish" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases are published from main only (ran on $GITHUB_REF)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building Cutback $version (publish: $publish)"

  build:
    name: ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # VideoLAN.LibVLC.Windows is only referenced when the build host is Windows,
          # so win-x64 must be published on a Windows runner.
          # `whisper` is the folder Whisper.net.Runtime uses under runtimes/ for that platform;
          # its names are not .NET RIDs (macos-arm64, not osx-arm64).
          - os: windows-latest
            rid: win-x64
            whisper: win-x64
            natives: true
          - os: ubuntu-latest
            rid: linux-x64
            whisper: linux-x64
            natives: true
          # Inside an .app bundle loose dylibs are what codesign expects, so do not self-extract.
          - os: macos-latest
            rid: osx-arm64
            whisper: macos-arm64
            natives: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
      WHISPER_RUNTIME: ${{ matrix.whisper }}
    steps:
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Versions are computed by the workflow, so nobody edits app.manifest per release.
      - name: Stamp version into app.manifest
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sed -i "s/\(assemblyIdentity version=\"\)[0-9.]*\"/\1${VERSION%%-*}.0\"/" src/Cutback.App/app.manifest
          grep assemblyIdentity src/Cutback.App/app.manifest

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Cutback.App -c Release -r "$RID" --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=${{ matrix.natives }} \
            -p:PublishTrimmed=false \
            -p:PublishReadyToRun=false \
            -p:DebugType=embedded \
            -p:PublishDocumentationFiles=false \
            -p:PublishDocumentationFile=false \
            -p:Version="$VERSION" \
            -p:ContinuousIntegrationBuild=true \
            -o "artifacts/publish/$RID"

      # Whisper.net.Runtime copies its native libraries for every platform into runtimes/, even
      # for a RID-specific publish. Besides the bloat, codesign refuses a macOS bundle that
      # contains foreign .so files, so drop every folder but this platform's. Where natives
      # self-extract (Windows, Linux) the single-file bundler has already absorbed this
      # platform's folder, so only foreign ones are left loose; on macOS it stays on disk.
      - name: Drop other platforms' Whisper natives
        shell: bash
        run: |
          runtimes="artifacts/publish/$RID/runtimes"
          for dir in "$runtimes"/*/; do
            dir=${dir%/}
            if [[ "$(basename "$dir")" != "$WHISPER_RUNTIME" ]]; then
              rm -rf "$dir"
            fi
          done
          rmdir "$runtimes" 2>/dev/null || true
          echo "Remaining under $runtimes:"; ls -R "$runtimes" 2>/dev/null || echo "(none; natives are inside the single-file bundle)"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="Cutback-$VERSION-$RID"
          mkdir -p "artifacts/stage/$name" artifacts/dist
          cp -R "artifacts/publish/$RID"/. "artifacts/stage/$name/"
          cp LICENSE THIRD-PARTY-NOTICES.md "artifacts/stage/$name/"
          (cd artifacts/stage && 7z a -tzip "../dist/$name.zip" "$name")

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="Cutback-$VERSION-$RID"
          mkdir -p "artifacts/stage/$name" artifacts/dist
          cp -R "artifacts/publish/$RID"/. "artifacts/stage/$name/"
          cp LICENSE THIRD-PARTY-NOTICES.md "artifacts/stage/$name/"
          chmod +x "artifacts/stage/$name/Cutback"
          tar -czf "artifacts/dist/$name.tar.gz" -C artifacts/stage "$name"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts/dist
          scripts/package-macos.sh "artifacts/publish/$RID" "$VERSION" artifacts/dist

      - uses: actions/upload-artifact@v7
        with:
          name: Cutback-${{ env.VERSION }}-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to overwrite an existing release or tag
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Pick a new version."
            exit 1
          fi
          existing=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag already exists at $existing, not at $GITHUB_SHA."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create tag and GitHub Release
        run: |
          args=(--target "$GITHUB_SHA" --generate-notes --title "Cutback $VERSION")
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "v$VERSION" "${args[@]}" dist/*
